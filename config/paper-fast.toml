# paper-fast.toml — paper mode, TA-only (no LLM), fastest iteration.
# Use when you want zero-latency signal→execution with no LLM dependency.

[bot]
mode = "paper"

[llm]
enabled                = false
fail_closed_without_llm = false  # TA signals proceed without LLM
entry_path_enabled     = false

[manager]
enabled = false

[screening]
enabled           = false

[risk]
max_open_positions  = 3
max_risk_per_trade  = 0.01
